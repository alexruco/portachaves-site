<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portachaves — Inscrição</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
  <style>
    body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:20px;color:#333}
    form{display:flex;flex-direction:column;gap:12px}input,select,button{padding:12px;font:inherit;border:1px solid #ccc;border-radius:6px}
    button{background:#111;color:white;border:0;cursor:pointer;font-weight:600}button:disabled{opacity:.6;cursor:wait}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <nav><a href="dashboard.html">Painel de gestão</a></nav>
  <h1>Portachaves</h1>
  <p>Inscreva o seu agregado uma vez. Depois, marque interesse nos imóveis que lhe agradam.</p>
  <section id="loginSection">
    <h2>Entrar ou inscrever-se</h2>
    <form id="loginForm">
      <label>Email <input id="email" type="email" autocomplete="email" required></label>
      <button type="submit">Receber link de acesso</button>
    </form>
  </section>
  <section id="memberSection" hidden>
    <p id="signedInAs"></p><button id="logout" type="button">Terminar sessão</button>
    <h2>Dados do agregado</h2>
    <form id="profileForm">
      <label>Nome completo <input id="name" type="text" autocomplete="name" required></label>
      <label>Telemóvel <input id="phone" type="tel" autocomplete="tel" required></label>
      <label>Rendimento líquido mensal (€) <input id="income" type="number" min="1" step="0.01" required></label>
      <label>Pessoas no agregado <input id="occupants" type="number" min="1" step="1" required></label>
      <label>Situação profissional <select id="employment">
        <option value="Efetivo">Contrato efetivo</option><option value="Recibos Verdes">Recibos verdes / independente</option>
        <option value="Estudante">Estudante / outro</option>
      </select></label>
      <button type="submit">Guardar inscrição</button>
    </form>
    <section id="interestSection" hidden>
      <h2>Interesse no imóvel</h2>
      <p>O seu perfil será associado a este imóvel. Pode retirar o interesse mais tarde.</p>
      <button id="interestButton" type="button"></button>
    </section>
  </section>
  <p id="feedback" role="status" aria-live="polite"></p>
  <script>
    const propertyId = new URLSearchParams(location.search).get('property_id');
    const loginSection = document.getElementById('loginSection');
    const memberSection = document.getElementById('memberSection');
    const interestSection = document.getElementById('interestSection');
    const interestButton = document.getElementById('interestButton');
    const feedback = document.getElementById('feedback');
    let profileId = null, interested = false;

    async function refreshInterest() {
      interestSection.hidden = !propertyId || !profileId;
      if (interestSection.hidden) return;
      const {data,error} = await db.from('applications').select('id')
        .eq('property_id',propertyId).eq('profile_id',profileId).maybeSingle();
      if (error) throw error;
      interested = Boolean(data);
      interestButton.textContent = interested ? 'Retirar interesse' : 'Tenho interesse neste imóvel';
    }
    async function checkSession() {
      const {data:{session},error} = await db.auth.getSession();
      if (error) throw error;
      loginSection.hidden = Boolean(session); memberSection.hidden = !session;
      if (!session) return;
      document.getElementById('signedInAs').textContent = session.user.email;
      const {data:profile,error:profileError} = await db.from('profiles')
        .select('id,full_name,phone,monthly_income,occupants_count,employment_type')
        .eq('user_id',session.user.id).maybeSingle();
      if (profileError) throw profileError;
      profileId = profile?.id ?? null;
      if (profile) {
        for (const [field,value] of Object.entries({
          name:profile.full_name,phone:profile.phone,income:profile.monthly_income,
          occupants:profile.occupants_count,employment:profile.employment_type
        })) document.getElementById(field).value = value ?? '';
      }
      await refreshInterest();
      if (propertyId && !profileId) feedback.textContent = 'Guarde a inscrição para marcar interesse neste imóvel.';
    }
    document.getElementById('loginForm').addEventListener('submit',async event => {
      event.preventDefault(); const button = event.currentTarget.querySelector('button'); button.disabled = true;
      try {
        const {error} = await db.auth.signInWithOtp({
          email:document.getElementById('email').value.trim(),options:{emailRedirectTo:location.href}
        });
        if (error) throw error;
        feedback.textContent = 'Enviámos um link de acesso para o seu email.';
      } catch(error) { feedback.textContent = 'Não foi possível enviar o link: ' + error.message; }
      finally { button.disabled = false; }
    });
    document.getElementById('profileForm').addEventListener('submit',async event => {
      event.preventDefault(); const button = event.currentTarget.querySelector('button'); button.disabled = true;
      try {
        const {data,error} = await db.rpc('save_family_profile',{
          p_full_name:document.getElementById('name').value.trim(),
          p_phone:document.getElementById('phone').value.trim(),
          p_monthly_income:Number(document.getElementById('income').value),
          p_occupants_count:Number(document.getElementById('occupants').value),
          p_employment_type:document.getElementById('employment').value
        });
        if (error) throw error;
        profileId = data; await refreshInterest(); feedback.textContent = 'Inscrição guardada.';
      } catch(error) { feedback.textContent = 'Não foi possível guardar: ' + error.message; }
      finally { button.disabled = false; }
    });
    interestButton.addEventListener('click',async () => {
      interestButton.disabled = true;
      try {
        const {data,error} = await db.rpc('set_property_interest',{
          p_property_id:propertyId,p_interested:!interested
        });
        if (error) throw error;
        interested = data;
        interestButton.textContent = interested ? 'Retirar interesse' : 'Tenho interesse neste imóvel';
        feedback.textContent = interested ? 'Interesse registado.' : 'Interesse retirado.';
      } catch(error) { feedback.textContent = 'Não foi possível alterar o interesse: ' + error.message; }
      finally { interestButton.disabled = false; }
    });
    document.getElementById('logout').addEventListener('click',async () => {
      await db.auth.signOut(); location.reload();
    });
    checkSession().catch(error => { feedback.textContent = error.message; });
  </script>
</body>
</html>
